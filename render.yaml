# Blueprint de Render para el backend de ToCosas.
# Despliegue: conecta el repo en https://dashboard.render.com/blueprints
# y Render creará el servicio web + la base de datos automáticamente.

databases:
  - name: tocosas-db
    plan: free
    databaseName: tocosas
    user: tocosas

services:
  - type: web
    name: tocosas-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /v1/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tocosas-db
          property: connectionString
      - key: PORT
        value: "3000"
      - key: NODE_ENV
        value: production
      # Secretos de JWT generados automáticamente por Render.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: "3600"
      # WhatsApp / LLM: se configuran en el panel cuando conectes Meta.
      - key: WHATSAPP_PROVIDER
        value: meta
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: LLM_API_KEY
        sync: false
